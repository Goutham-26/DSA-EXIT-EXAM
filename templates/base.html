<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Typewise{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('home') }}">
            <span class="brand-mark">P</span>
            <span>Typewise</span>
        </a>
        <nav>
            <a href="{{ url_for('home') }}">Overview</a>
            <a class="nav-cta" href="{{ url_for('predict') }}">Predict type <span aria-hidden="true">&#8594;</span></a>
        </nav>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer class="site-footer">
        <span>Pokémon primary-type classifier</span>
        <span>Built from G2.csv</span>
    </footer>
</body>
</html>
